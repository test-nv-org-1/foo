name: Mirror to test-nv-org-1/foo
on:
  workflow_dispatch: {}

# ensure at most one mirror workflow runs at any point in time
concurrency: mirror

jobs:
  mirror:
    # prevent this action from running in the mirror
    if: github.repository == 'test-nv-org-2/foo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push to mirror
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          refspecs=(
            'refs/remotes/origin/main:refs/heads/main'
            'refs/remotes/origin/release-*:refs/heads/release-*'
            'refs/tags/*:refs/tags/*'
          )
          # a refspec without a glob is an error if the source ref doesn't exist
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            refspecs+=('refs/remotes/origin/gh-pages:refs/heads/gh-pages')
          fi
          # push to the URL directly so the token is not stored in .git/config
          git push --prune \
            "https://x-access-token:${MIRROR_PAT}@github.com/test-nv-org-1/foo.git" \
            "${refspecs[@]}"
